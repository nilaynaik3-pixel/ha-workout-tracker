log_set:
  name: Log a set
  fields:
    exercise:
      name: Exercise
      selector:
        text: {}
    weight:
      name: Weight
      selector:
        number:
          min: 0
          max: 100000
          step: 0.5
          mode: box
    reps:
      name: Reps
      selector:
        number:
          min: 0
          max: 100000
          step: 0.5
          mode: box
    rpe:
      name: Rpe
      selector:
        number:
          min: 0
          max: 100000
          step: 0.5
          mode: box
    warmup:
      name: Warmup
      selector:
        boolean: {}
rpe_all:
  name: Same RPE for today's sets
  fields:
    exercise:
      name: Exercise
      selector:
        text: {}
    rpe:
      name: Rpe
      selector:
        number:
          min: 0
          max: 100000
          step: 0.5
          mode: box
    only_missing:
      name: Only missing
      selector:
        boolean: {}
undo:
  name: Undo the last set
  fields:
    exercise:
      name: Exercise
      selector:
        text: {}
set_note:
  name: Save an exercise note
  fields:
    exercise:
      name: Exercise
      selector:
        text: {}
    note:
      name: Note
      selector:
        text: {}
select_exercise:
  name: Show an exercise
  fields:
    exercise:
      name: Exercise
      selector:
        text: {}
select_main:
  name: Choose the main group
  fields:
    group:
      name: Group
      selector:
        text: {}
toggle_addon:
  name: Turn an add-on group on or off
  fields:
    group:
      name: Group
      selector:
        text: {}
    'on':
      name: 'On'
      selector:
        boolean: {}
suggest:
  name: Go back to today's suggested plan
add_exercise:
  name: Add an exercise
  fields:
    name:
      name: Name
      selector:
        text: {}
    group:
      name: Group
      selector:
        text: {}
    step:
      name: Step
      selector:
        number:
          min: 0
          max: 100000
          step: 0.5
          mode: box
    demo:
      name: Library demo id
      description: Exercise id from the built-in library, for the picture and instructions.
      selector:
        text: {}
set_demo:
  name: Set an exercise's demo
  fields:
    exercise:
      name: Exercise
      selector:
        text: {}
    demo:
      name: Library demo id
      description: Leave empty to remove the demo.
      selector:
        text: {}
rest_start:
  name: Start the rest timer
  fields:
    seconds:
      name: Seconds
      description: Defaults to your rest length.
      selector:
        number:
          min: 5
          max: 3600
          mode: box
rest_stop:
  name: Stop the rest timer
rest_add:
  name: Add time to the rest timer
  fields:
    seconds:
      name: Seconds
      description: Negative to take time off.
      selector:
        number:
          min: -600
          max: 600
          mode: box
rest_settings:
  name: Rest timer settings
  fields:
    seconds:
      name: Rest length (seconds, 0 = off)
      selector:
        number:
          min: 0
          max: 3600
          mode: box
    notify:
      name: Phone notification when rest is over
      selector:
        boolean: {}
hide_exercise:
  name: Hide an exercise (history is kept)
  fields:
    exercise:
      name: Exercise
      selector:
        text: {}
set_day:
  name: Log sets to another day
  fields:
    day:
      name: Day
      selector:
        text: {}
open_day:
  name: Open a day in the calendar
  fields:
    day:
      name: Day
      selector:
        text: {}
update_set:
  name: Change a logged set
  fields:
    set_id:
      name: Set id
      selector:
        number:
          min: 0
          max: 100000
          step: 0.5
          mode: box
    weight:
      name: Weight
      selector:
        number:
          min: 0
          max: 100000
          step: 0.5
          mode: box
    reps:
      name: Reps
      selector:
        number:
          min: 0
          max: 100000
          step: 0.5
          mode: box
    rpe:
      name: Rpe
      selector:
        number:
          min: 0
          max: 100000
          step: 0.5
          mode: box
    warmup:
      name: Warmup
      selector:
        boolean: {}
delete_set:
  name: Delete a logged set
  fields:
    set_id:
      name: Set id
      selector:
        number:
          min: 0
          max: 100000
          step: 0.5
          mode: box
add_set:
  name: Add a set to a day
  fields:
    day:
      name: Day
      selector:
        text: {}
    exercise:
      name: Exercise
      selector:
        text: {}
    weight:
      name: Weight
      selector:
        number:
          min: 0
          max: 100000
          step: 0.5
          mode: box
    reps:
      name: Reps
      selector:
        number:
          min: 0
          max: 100000
          step: 0.5
          mode: box
    rpe:
      name: Rpe
      selector:
        number:
          min: 0
          max: 100000
          step: 0.5
          mode: box
log_body:
  name: Log a body measurement
  fields:
    metric:
      name: Metric
      selector:
        text: {}
    value:
      name: Value
      selector:
        number:
          min: 0
          max: 100000
          step: 0.5
          mode: box
    day:
      name: Day
      selector:
        text: {}
delete_body:
  name: Delete a body measurement
  fields:
    entry_id:
      name: Entry id
      selector:
        number:
          min: 0
          max: 100000
          step: 0.5
          mode: box
gym_start:
  name: Start a gym visit
gym_end:
  name: End the gym visit
export:
  name: Export everything to CSV
refresh:
  name: Reload the exercise list and settings
med_save:
  name: Add or change a medicine or supplement
  fields:
    med_id:
      name: Id (leave empty to add a new one)
      selector:
        number:
          min: 1
          max: 100000
          mode: box
    name:
      name: Name
      required: true
      selector:
        text: {}
    kind:
      name: Type
      selector:
        select:
          options: [medication, supplement]
    dose:
      name: Dose
      example: 1 tablet
      selector:
        text: {}
    note:
      name: Note
      example: with food
      selector:
        text: {}
    echo:
      name: Also on the Echo when home
      selector:
        boolean: {}
    schedule:
      name: Schedule
      description: 'repeat: daily/weekly/none, every: N, days: [0-6, Monday = 0], times: ["08:00"], start: date, end: date or null'
      required: true
      example: '{"repeat": "daily", "every": 1, "times": ["08:00", "20:00"]}'
      selector:
        object: {}
med_delete:
  name: Delete a medicine (history is kept)
  fields:
    med_id:
      name: Id
      required: true
      selector:
        number:
          min: 1
          max: 100000
          mode: box
med_pause:
  name: Pause or resume a medicine's reminders
  fields:
    med_id:
      name: Id
      required: true
      selector:
        number:
          min: 1
          max: 100000
          mode: box
    paused:
      name: Paused
      selector:
        boolean: {}
med_log:
  name: Log a dose as taken or skipped
  fields:
    med_id:
      name: Id
      required: true
      selector:
        number:
          min: 1
          max: 100000
          mode: box
    status:
      name: Status
      selector:
        select:
          options: [taken, skipped]
    due:
      name: Scheduled dose
      description: 'YYYY-MM-DD HH:MM of the dose; leave empty for an as-needed dose'
      selector:
        text: {}
med_undo:
  name: Undo a logged dose
  fields:
    log_id:
      name: Log id
      required: true
      selector:
        number:
          min: 1
          max: 1000000
          mode: box
