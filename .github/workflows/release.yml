name: Release

# Publishes a release whenever the version in manifest.json has none yet,
# so HACS always has a version to download.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release the manifest version if it's new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version custom_components/workout_tracker/manifest.json)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already released"
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$version" --generate-notes
